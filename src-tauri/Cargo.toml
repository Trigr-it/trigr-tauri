[package]
name = "keyfire"
version = "0.1.0"
description = "Visual Hotkey & Macro Manager"
authors = ["Keyfire"]
edition = "2021"
default-run = "keyfire"

[lib]
name = "keyfire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "keyfire"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for .transparent(true) overlay windows on macOS
# (Mac port Phase 0). No effect on the Windows build; rules out Mac App Store
# distribution only, which is not the plan (direct .dmg).
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", features = ["rustls-tls"] }
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = "0.4"
regex-lite = "0.1"
opener = "0.7"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
notify = "8"
color-thief = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core", "std"] }
rand = "0.8"
base64 = "0.22"
# Used only by telemetry.rs for the daily aggregate POST. Already in the
# dependency tree transitively via tauri-plugin-updater (rustls-tls path),
# so adding the direct dep is essentially free in binary size. Blocking
# client keeps the telemetry thread synchronous (no tokio runtime needed).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
uuid = { version = "1", features = ["v4"] }
rust_xlsxwriter = "0.97.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows-collections = "0.2"
windows = { version = "0.61", features = [
    "Media_SpeechRecognition",
    "Media_Devices",
    "Media_MediaProperties",
    "Media_Ocr",
    "Graphics_Imaging",
    "Foundation",
    "Foundation_Collections",
    "Devices_Enumeration",
    "Storage_Streams",
    # Win32 COM audio endpoint volume — used by src/volume.rs for the
    # Change Volume macro step's exact Set / Increase / Decrease / Mute.
    # Audio_Endpoints is a separate feature — IAudioEndpointVolume lives
    # under the Endpoints submodule.
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    # Audio device switching (src/audio_devices.rs) — PKEY_Device_FriendlyName
    # from FunctionDiscovery + PropVariantToStringAlloc from PropertiesSystem.
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    # Shell COM for the Files macro steps (Create Folder / Copy Files /
    # Move Files) — src/shell_files.rs. IShellWindows (foreground Explorer
    # folder + selection) + IFileOperation (native copy/move with progress
    # and conflict dialogs). Ole is needed for IOleWindow (IShellBrowser's
    # base), Variant for IShellWindows::Item/FindWindowSW VARIANT params.
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_Media",
    "Win32_Security_Cryptography",
    "Win32_System_Shutdown",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
