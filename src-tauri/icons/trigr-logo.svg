<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Keyfire">
  <defs>
    <linearGradient id="trigr-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0b942"/>
      <stop offset="100%" stop-color="#c8860a"/>
    </linearGradient>
    <linearGradient id="trigr-keytop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e5dc"/>
    </linearGradient>
  </defs>
  <!-- Gold base with rounded corners (chamfered keycap housing) -->
  <rect x="0" y="0" width="64" height="64" rx="9" fill="url(#trigr-base)"/>
  <!-- White keytop inset -->
  <rect x="7.68" y="6.4" width="48.64" height="43.52" rx="6.5" fill="url(#trigr-keytop)"/>
  <!-- Bottom inner shadow on keytop (subtle depth) -->
  <rect x="7.68" y="46.5" width="48.64" height="3.42" rx="1.5" fill="#000000" opacity="0.06"/>
  <!-- Flame legend stamped on keytop (D baseline) -->
  <path d="M 33 14 C 36 18, 41 23, 41 30 C 41 37, 36 41, 32 41 C 26 41, 22 37, 22 32 C 22 28, 25 26, 27 23 C 28 26, 30 27, 30 24 C 30 20, 32 17, 33 14 Z" fill="#c8860a"/>
