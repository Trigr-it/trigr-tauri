[build]
  publish = "docs"
  command = '''echo 'Static site — IndexNow ping' && curl -sS -X POST -H 'Content-Type: application/json' --data-raw '{"host":"usetrigr.com","key":"24db6ec83ef4488ba706bf6cd5fcb81b","keyLocation":"https://usetrigr.com/24db6ec83ef4488ba706bf6cd5fcb81b.txt","urlList":["https://usetrigr.com/","https://usetrigr.com/pricing.html","https://usetrigr.com/text-expander.html","https://usetrigr.com/autohotkey-alternative.html","https://usetrigr.com/roadmap.html","https://usetrigr.com/trigr-help.html","https://usetrigr.com/blog/","https://usetrigr.com/blog/custom-hotkeys-windows-no-coding.html","https://usetrigr.com/blog/best-text-expander-windows-11-2026.html"]}' https://api.indexnow.org/indexnow || true'''

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://betalist.com https://peerpush.com https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://api.github.com https://plausible.io https://www.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'"
