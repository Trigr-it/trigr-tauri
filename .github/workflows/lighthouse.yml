name: Lighthouse CI

# Runs Lighthouse against the deployed keyfire.app pages on every push to
# main and on PRs that touch the docs/ tree. Asserts CWV thresholds per
# the Phase 4 monitoring plan in docs/private/usetrigr-audit/IMPLEMENTATION-TODO.md.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'netlify.toml'
      - 'scripts/netlify-build.sh'
      - '.github/workflows/lighthouse.yml'
      - '.lighthouserc.json'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'netlify.toml'
      - 'scripts/netlify-build.sh'
      - '.github/workflows/lighthouse.yml'
      - '.lighthouserc.json'
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Netlify deploy
        if: github.event_name == 'push'
        run: sleep 90

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://keyfire.app/
            https://keyfire.app/pricing.html
            https://keyfire.app/text-expander.html
            https://keyfire.app/autohotkey-alternative.html
            https://keyfire.app/blog/best-text-expander-windows-11-2026.html
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json
