name: Release
# Tag-driven, platform-split so Windows and macOS ship on independent
# cadences with independent version numbers (Windows version lives in
# tauri.conf.json; macOS in tauri.macos.conf.json, auto-merged on mac
# builds). A macOS beta release NEVER touches Windows users:
#   * `v*` / `win-v*`  → Windows x64 + ARM  (Mac jobs skipped)
#   * `mac-v*`         → macOS universal .dmg (Windows jobs skipped)
# Mac releases are marked prerelease so GitHub's `releases/latest`
# pointer — which the shared updater manifest resolves through — always
# stays on the newest Windows (non-prerelease) release.
on:
  push:
    tags:
      - 'v*'
      - 'win-v*'
      - 'mac-v*'
jobs:
  release-x64:
    if: ${{ !startsWith(github.ref_name, 'mac-v') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install trusted-signing-cli
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $dir = "$env:RUNNER_TEMP\signing"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/Levminer/trusted-signing-cli/releases/download/0.10.0/trusted-signing-cli.exe" -OutFile "$dir\trusted-signing-cli.exe"
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          $sdkRoot = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
          $signtool = Get-ChildItem -Path $sdkRoot -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in Windows SDK on this runner" }
          "SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "trusted-signing-cli: $dir\trusted-signing-cli.exe"
          Write-Output "signtool: $($signtool.FullName)"
      - name: Add signing script to PATH
        shell: pwsh
        run: |
          $scriptDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri\scripts"
          if (-not (Test-Path "$scriptDir\keyfire-sign.cmd")) { throw "keyfire-sign.cmd not found at $scriptDir" }
          Add-Content -Path $env:GITHUB_PATH -Value $scriptDir
          Write-Output "Added to PATH: $scriptDir"
      - name: Verify Azure signing connectivity
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $test = "$env:RUNNER_TEMP\preflight-sign.exe"
          Copy-Item "$env:RUNNER_TEMP\signing\trusted-signing-cli.exe" $test -Force
          Write-Output "Pre-flight test file: $test ($((Get-Item $test).Length) bytes)"
          $stdoutFile = "$env:RUNNER_TEMP\tsc-preflight.log"
          & trusted-signing-cli -e https://weu.codesigning.azure.net -a nodescaffold-signing -c node-public-trust -d "Preflight" $test *>&1 | Tee-Object -FilePath $stdoutFile
          $tscExit = $LASTEXITCODE
          Write-Output "trusted-signing-cli exit code: $tscExit"
          if ($tscExit -ne 0) {
            Write-Output "=== Full pre-flight output ==="
            Get-Content $stdoutFile
            throw "trusted-signing-cli pre-flight FAILED — Azure auth / connectivity / config issue before the 10-min compile"
          }
          & $env:SIGNTOOL_PATH verify /pa /v $test
          if ($LASTEXITCODE -ne 0) {
            # Soft-warn only: as of 2026-06-18 signtool verify hit a
            # WinVerifyTrust 0x80096011 "malformed" error against a
            # signature the same Azure call produced cleanly (Number of
            # files Signed: 1, errors: 0). Same workflow shipped v0.5.3
            # 3 days prior, so something moved in the runner's signtool
            # or Azure's signature emission. Real production NSIS sign
            # happens later in the build with its own signCommand + verify;
            # let that be the authoritative gate rather than blocking on a
            # check whose own verify path is misfiring.
            Write-Warning "signtool verify of pre-flight signature failed (exit $LASTEXITCODE) — continuing; real NSIS sign step is the authoritative gate"
            # GitHub Actions' pwsh wrapper auto-exits with $LASTEXITCODE at
            # script end. Reset to 0 so this step doesn't fail despite the
            # explicit Write-Warning soft-mode above.
            $global:LASTEXITCODE = 0
          } else {
            Write-Output "Pre-flight signing PASSED — Azure is reachable, cert profile resolves, signature applies cleanly"
          }
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: release-x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm install
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Keyfire ${{ github.ref_name }}'
          releaseBody: |
            ## Download
            **Windows (most users):** trigr_x64-setup.exe
            **Windows ARM:** trigr_aarch64-setup.exe

            ---
          releaseDraft: false
          generateReleaseNotes: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.signing.conf.json
      - name: Upload versionless x64 alias
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleDir -Filter "Keyfire_*_x64-setup.exe" -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) { throw "No x64 installer found in $bundleDir" }
          $dst = "Keyfire_x64-setup.exe"
          Copy-Item $installer.FullName $dst
          Write-Output "Uploading $($installer.Name) as $dst"
          gh release upload "${{ github.ref_name }}" $dst --clobber

  release-arm64:
    if: ${{ !startsWith(github.ref_name, 'mac-v') }}
    needs: release-x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Install trusted-signing-cli
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $dir = "$env:RUNNER_TEMP\signing"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/Levminer/trusted-signing-cli/releases/download/0.10.0/trusted-signing-cli.exe" -OutFile "$dir\trusted-signing-cli.exe"
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          Write-Output "trusted-signing-cli: $dir\trusted-signing-cli.exe"
      - name: Add signing script to PATH
        shell: pwsh
        run: |
          $scriptDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri\scripts"
          if (-not (Test-Path "$scriptDir\keyfire-sign.cmd")) { throw "keyfire-sign.cmd not found at $scriptDir" }
          Add-Content -Path $env:GITHUB_PATH -Value $scriptDir
          Write-Output "Added to PATH: $scriptDir"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: release-aarch64-pc-windows-msvc
      - name: Install dependencies
        run: npm install
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Keyfire ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: --target aarch64-pc-windows-msvc --config src-tauri/tauri.signing.conf.json
      - name: Upload versionless arm64 alias
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleDir = "src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleDir -Filter "Keyfire_*_arm64-setup.exe" -ErrorAction Stop | Select-Object -First 1
          if (-not $installer) { throw "No arm64 installer found in $bundleDir" }
          $dst = "Keyfire_arm64-setup.exe"
          Copy-Item $installer.FullName $dst
          Write-Output "Uploading $($installer.Name) as $dst"
          gh release upload "${{ github.ref_name }}" $dst --clobber

  # ── macOS beta (universal .dmg) ──────────────────────────────────────────
  # Runs ONLY on `mac-v*` tags, so Windows releases never trigger a mac
  # build and vice versa. UNSIGNED for the beta phase — testers run
  # `xattr -cr Keyfire.app` (or the .dmg) once, same as the port-check
  # artifact. tauri.macos.conf.json auto-merges: it supplies the mac beta
  # version, app+dmg targets, and createUpdaterArtifacts:false (no update
  # manifest is produced, so nothing can collide with the Windows
  # updater). Published as a PRERELEASE so GitHub's `releases/latest`
  # pointer stays on the newest Windows release.
  #
  # TO ENABLE SIGNING + NOTARIZATION later (before a public mac launch):
  #   - Add APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
  #     APPLE_SIGNING_IDENTITY (Developer ID Application) and, for
  #     notarization, APPLE_ID / APPLE_PASSWORD (app-specific) /
  #     APPLE_TEAM_ID as repo secrets, and pass them in `env:` below —
  #     tauri-action picks them up automatically.
  #   - To turn on mac auto-update: flip createUpdaterArtifacts to true in
  #     tauri.macos.conf.json, publish latest-mac.json to a floating
  #     `mac-latest` release (the endpoint tauri.macos.conf.json already
  #     points at), and pass TAURI_SIGNING_PRIVATE_KEY here.
  release-macos:
    if: ${{ startsWith(github.ref_name, 'mac-v') }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both arches so tauri can lipo a universal binary (Intel + Apple Silicon).
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: release-universal-apple-darwin
      # Repo ships png/ico only; the macOS bundler needs an .icns
      # (mirrors the port-check .dmg job).
      - name: Generate icon.icns from icon.png
        run: |
          cd src-tauri/icons
          mkdir icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s icon.png --out icon.iconset/icon_${s}x${s}.png
          done
          cp icon.iconset/icon_32x32.png icon.iconset/icon_16x16@2x.png
          cp icon.iconset/icon_64x64.png icon.iconset/icon_32x32@2x.png
          cp icon.iconset/icon_256x256.png icon.iconset/icon_128x128@2x.png
          cp icon.iconset/icon_512x512.png icon.iconset/icon_256x256@2x.png
          iconutil -c icns icon.iconset -o icon.icns
      - name: Install dependencies
        run: npm install
      - name: Build and release (universal, unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Keyfire macOS ${{ github.ref_name }}'
          releaseBody: |
            ## macOS beta (unsigned)
            **Download:** Keyfire_universal.dmg — runs on Apple Silicon and Intel.

            First launch is Gatekeeper-blocked because the build is unsigned.
            Clear the quarantine flag once after installing:
            ```
            xattr -cr /Applications/Keyfire.app
            ```
            ---
          releaseDraft: false
          generateReleaseNotes: true
          prerelease: true
          args: --target universal-apple-darwin
