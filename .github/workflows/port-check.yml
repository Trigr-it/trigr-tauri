name: Port Check
# Compile gate for the cross-platform seam (Mac port Phase 0).
# Runs cargo check on macOS + Windows for every push to a port/** branch:
# macOS proves the stub seam compiles for the new target, Windows proves the
# seam did not regress the shipping build. No bundling, no signing.
on:
  push:
    branches:
      - 'port/**'

jobs:
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: port-check-macos
      # generate_context! embeds the frontend dist at compile time, so the
      # frontend must be built before cargo check can succeed.
      - name: Build frontend
        run: |
          npm install
          npm run build
      - name: cargo check (macOS)
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # Unsigned test .dmg for on-device testing (Mac port Phase 1). No Apple
  # signing/notarization: open on the test Mac via right-click > Open.
  # tauri.macos.conf.json merges automatically on macOS builds (targets
  # app+dmg, updater artifacts off).
  build-macos-dmg:
    needs: check-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: port-dmg-macos
      # Repo ships png/ico only; the macOS bundler needs an .icns.
      - name: Generate icon.icns from icon.png
        run: |
          cd src-tauri/icons
          mkdir icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s icon.png --out icon.iconset/icon_${s}x${s}.png
          done
          cp icon.iconset/icon_32x32.png icon.iconset/icon_16x16@2x.png
          cp icon.iconset/icon_64x64.png icon.iconset/icon_32x32@2x.png
          cp icon.iconset/icon_256x256.png icon.iconset/icon_128x128@2x.png
          cp icon.iconset/icon_512x512.png icon.iconset/icon_256x256@2x.png
          iconutil -c icns icon.iconset -o icon.icns
      - name: Install dependencies
        run: npm install
      - name: Build .dmg
        uses: tauri-apps/tauri-action@v0
      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyfire-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: port-check-windows
      - name: Build frontend
        run: |
          npm install
          npm run build
      - name: cargo check (Windows)
        run: cargo check --manifest-path src-tauri/Cargo.toml
